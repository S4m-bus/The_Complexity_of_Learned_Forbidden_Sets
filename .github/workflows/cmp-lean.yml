name: CMP Lean Verification

on:
  push:
    branches: [cmp-lean-verification]
  pull_request:
    branches: [main]
    paths:
      - 'CMPLean/**'
      - 'CMPLean.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/cmp-lean.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: true
      - name: Proof-hole audit
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b|^axiom ' CMPLean; then
            echo 'Proof hole or custom axiom detected.'
            exit 1
          fi
