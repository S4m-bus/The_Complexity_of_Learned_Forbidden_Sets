name: CMP Lean Verification

on:
  push:
    branches: [cmp-lean-verification]
  pull_request:
    branches: [main]
    paths:
      - 'CMPLean/**'
      - 'CMPLean.lean'
      - 'lakefile.toml'
      - 'lean-toolchain'
      - '.github/workflows/cmp-lean.yml'

concurrency:
  group: cmp-lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bootstrap Lean and generate manifest
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/lake update
      - uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          use-mathlib-cache: true
          leanchecker: false
      - name: Proof-hole audit
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b|^axiom ' CMPLean; then
            echo 'Proof hole or custom axiom detected.'
            exit 1
          fi
