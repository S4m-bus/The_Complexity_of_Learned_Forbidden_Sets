name: CMP Lean Verification

on:
  push:
    branches: [cmp-lean-verification]
  pull_request:
    paths:
      - 'CMPLean/**'
      - '.github/workflows/cmp-lean.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Fetch Mathlib
        working-directory: CMPLean
        run: |
          $HOME/.elan/bin/lake update
          $HOME/.elan/bin/lake exe cache get
      - name: Kernel build
        working-directory: CMPLean
        run: $HOME/.elan/bin/lake build
      - name: Proof-hole audit
        run: |
          if grep -R -n -E '\bsorry\b|\badmit\b|^axiom ' CMPLean/CMPLean; then
            echo 'Proof hole or custom axiom detected.'
            exit 1
          fi
